<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9C4522">
<meta name="robots" content="noindex">
<title>Caja · Que Roles</title>
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="icon" href="/img/logo.png">

<body>
<section id="auth" class="auth"><div class="auth-card"><img src="/img/logo.png" alt=""><h1 id="authTitle">Que Roles</h1><p id="authDesc">Abriendo tu negocio…</p><div id="authForm"></div><div class="auth-msg" id="authMsg" role="status" aria-live="polite"></div></div></section>
<div class="hd"><div class="wrap">
  <div class="brand"><img src="/img/logo.png" alt=""><span>Caja</span></div>
  <button class="ratebtn" id="ratebtn" data-act="rate" type="button" aria-label="Cambiar la tasa del día"><small id="rl">Tasa BCV</small><b id="rv">Bs 0,00</b></button>
</div></div>
<main><div class="wrap" id="view"></div></main>
<nav class="nav" aria-label="Secciones"><div class="wrap">
  <button type="button" data-act="tab" data-t="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Resumen</button>
  <button type="button" data-act="tab" data-t="ventas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Ventas</button>
  <button type="button" class="plus" data-act="newsale" aria-label="Nueva venta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button type="button" data-act="tab" data-t="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.5 3-5.5 6.5-5.5s6 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .6 3.2 2.4 3.5 5.2"/></svg>Clientes</button>
  <button type="button" data-act="tab" data-t="inventario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Inventario</button>
  <button type="button" data-act="tab" data-t="cuentas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/><path d="M6 6l9-3 2 3"/></svg>Cuentas</button>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
